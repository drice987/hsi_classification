[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi"
version = "0.1.0"
description = "Hyperspectral spatial-spectral classification, self-supervised representation learning, and cross-mission spectral analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imagecodecs>2023.1.23",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "tifffile>=2023.7",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",
    "E741",
]