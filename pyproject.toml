[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi"
version = "0.1.0"
description = "Physical VNIR-SWIR absorption spectroscopy and self-supervised learning for EnMAP and imaging spectroscopy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imagecodecs>=2023.1.23",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "tifffile>=2023.7",
    "torch>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["EXE002"]

[tool.ruff.lint.isort]
known-first-party = ["hsi"]